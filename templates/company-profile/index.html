<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Company Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="client/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ENGINE FILE: page skeleton. Text comes from client/content.js, colors from client/theme.css. -->
  <div class="app">
    <header class="topbar">
      <div class="logo" id="logo"></div>
      <span class="brand" id="brand"></span>
      <span class="chip chip-note" id="note"></span>
    </header>

    <main class="stage" id="stage" aria-roledescription="carousel">
      <div class="track" id="track"></div>
    </main>

    <footer class="controls">
      <button class="icon-btn" id="prev" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dots" id="dots"></div>
      <span class="counter" id="counter" aria-live="polite"></span>
      <button class="icon-btn" id="next" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </footer>
  </div>

  <script src="client/content.js"></script>
  <script src="js/carousel.js"></script>
</body>
</html>
